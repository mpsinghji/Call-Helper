name: Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Determine and Validate Version and Tag
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_TAG="${GITHUB_REF#refs/tags/}"
            if [[ ! "$RAW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Git tag '$RAW_TAG' does not match required SemVer format ^v[0-9]+\.[0-9]+\.[0-9]+$"
              exit 1
            fi
            VERSION="${RAW_TAG#v}"
            TAG="$RAW_TAG"
          else
            VERSION=$(grep -m 1 'versionName' app/build.gradle.kts | sed -E 's/.*versionName\s*=\s*"([^"]+)".*/\1/' | tr -d '[:space:]')
            TAG="v${VERSION}"
          fi

          # Strict SemVer validation: MUST be exactly MAJOR.MINOR.PATCH
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Calculated version '$VERSION' does not match required SemVer format ^[0-9]+\.[0-9]+\.[0-9]+$ (MAJOR.MINOR.PATCH)"
            exit 1
          fi

          # Strict Git tag validation: MUST be exactly vMAJOR.MINOR.PATCH
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Calculated tag '$TAG' does not match required format ^v[0-9]+\.[0-9]+\.[0-9]+$"
            exit 1
          fi

          echo "Validated Version: $VERSION"
          echo "Validated Tag: $TAG"
          RELEASE_NAME="Release ${TAG}"

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT

          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          DEST_APK="app/build/outputs/apk/debug/CallHelper-${TAG}.apk"
          if [ -f "$SRC_APK" ]; then
            cp "$SRC_APK" "$DEST_APK"
            echo "apk_path=${DEST_APK}" >> $GITHUB_OUTPUT
          else
            echo "Error: $SRC_APK not found!"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.release_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          files: |
            ${{ steps.vars.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
