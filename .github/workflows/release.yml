name: Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set in GitHub repository secrets!"
            exit 1
          fi
          KEYSTORE_DIR="${RUNNER_TEMP}/keystore"
          mkdir -p "$KEYSTORE_DIR"
          KEYSTORE_PATH="${KEYSTORE_DIR}/release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "KEYSTORE_FILE=$KEYSTORE_PATH" >> $GITHUB_ENV

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Cleanup Release Keystore
        if: always()
        run: |
          shred -u "${RUNNER_TEMP}/keystore/release.jks" 2>/dev/null || rm -f "${RUNNER_TEMP}/keystore/release.jks"
          rm -rf "${RUNNER_TEMP}/keystore"

      - name: Determine and Validate Version and Tag
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_TAG="${GITHUB_REF#refs/tags/}"
            if [[ ! "$RAW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Git tag '$RAW_TAG' does not match required SemVer format ^v[0-9]+\.[0-9]+\.[0-9]+$"
              exit 1
            fi
            VERSION="${RAW_TAG#v}"
            TAG="$RAW_TAG"
          else
            VERSION=$(grep -m 1 'versionName' app/build.gradle.kts | sed -E 's/.*versionName\s*=\s*"([^"]+)".*/\1/' | tr -d '[:space:]')
            TAG="v${VERSION}"
          fi

          # Strict SemVer validation: MUST be exactly MAJOR.MINOR.PATCH
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Calculated version '$VERSION' does not match required SemVer format ^[0-9]+\.[0-9]+\.[0-9]+$ (MAJOR.MINOR.PATCH)"
            exit 1
          fi

          # Strict Git tag validation: MUST be exactly vMAJOR.MINOR.PATCH
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Calculated tag '$TAG' does not match required format ^v[0-9]+\.[0-9]+\.[0-9]+$"
            exit 1
          fi

          echo "Validated Version: $VERSION"
          echo "Validated Tag: $TAG"
          RELEASE_NAME="Release ${TAG}"

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT

          SRC_APK="app/build/outputs/apk/release/app-release.apk"
          DEST_APK="app/build/outputs/apk/release/CallHelper-${TAG}.apk"
          if [ -f "$SRC_APK" ]; then
            cp "$SRC_APK" "$DEST_APK"
            echo "apk_path=${DEST_APK}" >> $GITHUB_OUTPUT
          else
            echo "Error: $SRC_APK not found!"
            exit 1
          fi

      - name: Verify Release APK Signature and Integrity
        run: |
          APK_PATH="${{ steps.vars.outputs.apk_path }}"
          EXPECTED_VERSION="${{ steps.vars.outputs.version }}"

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK file not found: $APK_PATH"
            exit 1
          fi

          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          AAPT="$BUILD_TOOLS_DIR/aapt"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          echo "Using Android build-tools from: $BUILD_TOOLS_DIR"

          # 1. Verify Package Name, versionCode, and versionName
          BADGING=$("$AAPT" dump badging "$APK_PATH")
          PKG_NAME=$(echo "$BADGING" | grep -m 1 -o "package: name='[^']*'" | cut -d"'" -f2)
          V_CODE=$(echo "$BADGING" | grep -m 1 -o " versionCode='[^']*'" | cut -d"'" -f2)
          V_NAME=$(echo "$BADGING" | grep -m 1 -o " versionName='[^']*'" | cut -d"'" -f2)

          echo "APK Metadata: Package=$PKG_NAME, versionCode=$V_CODE, versionName=$V_NAME"

          if [ "$PKG_NAME" != "com.callhandler.service" ]; then
            echo "::error::Package ID mismatch! Expected 'com.callhandler.service', found '$PKG_NAME'"
            exit 1
          fi
          if [ "$V_NAME" != "$EXPECTED_VERSION" ]; then
            echo "::error::versionName mismatch! Expected '$EXPECTED_VERSION', found '$V_NAME'"
            exit 1
          fi

          # 2. Verify Production Signing Certificate SHA-256 (exact, case-insensitive)
          CERT_OUTPUT=$("$APKSIGNER" verify --verbose --print-certs "$APK_PATH")
          echo "$CERT_OUTPUT"

          EXPECTED_SHA256="23414c2ab95cddc0e1818a73fd00867b2578233462543585aa900e2090491c39"
          ACTUAL_SHA256=$(echo "$CERT_OUTPUT" | grep -i "certificate SHA-256 digest:" | head -n 1 | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')
          EXPECTED_LOWER=$(echo "$EXPECTED_SHA256" | tr '[:upper:]' '[:lower:]')

          echo "Expected Certificate SHA-256: $EXPECTED_LOWER"
          echo "Extracted Certificate SHA-256: $ACTUAL_SHA256"

          if [ "$ACTUAL_SHA256" != "$EXPECTED_LOWER" ]; then
            echo "::error::Production certificate mismatch! Expected '$EXPECTED_LOWER', got '$ACTUAL_SHA256'"
            exit 1
          fi

          echo "=================================================="
          echo "VERIFICATION PASSED: Production Certificate SHA-256 matches exactly!"
          echo "=================================================="

      - name: Generate Checksums
        id: checksum
        run: |
          APK_DIR=$(dirname "${{ steps.vars.outputs.apk_path }}")
          APK_NAME=$(basename "${{ steps.vars.outputs.apk_path }}")
          CHECKSUM_FILE="${APK_DIR}/SHA256SUMS.txt"
          (cd "$APK_DIR" && sha256sum "$APK_NAME" > "SHA256SUMS.txt")
          echo "=== SHA256SUMS.txt ==="
          cat "$CHECKSUM_FILE"
          echo "checksum_path=${CHECKSUM_FILE}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.release_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          files: |
            ${{ steps.vars.outputs.apk_path }}
            ${{ steps.checksum.outputs.checksum_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
